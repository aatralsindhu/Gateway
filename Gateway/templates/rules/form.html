{% extends 'base.html' %}

{% block content %}
<style>
.create-rule-container {
  max-width: 700px;
  margin: 32px auto;
  background: #fff;
  padding: 30px 38px 38px 38px;
  border-radius: 10px;
  box-shadow: 0 2px 17px rgba(0,0,0,0.09);
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}
.create-rule-container h2 {
  text-align: center;
  color: #30475e;
  font-weight: 700;
  margin-bottom: 28px;
}
.form-section {
  margin-bottom: 20px;
}
.advanced-toggle {
  display: flex;
  align-items: center;
  cursor: pointer;
  background: #f7f9fc;
  border: none;
  padding: 10px 0;
  font-weight: 600;
  color: #007bff;
  font-size: 1.03rem;
  transition: background 0.18s;
}
.advanced-toggle .chevron {
  margin-left: 15px;
  transition: transform 0.2s;
}
.advanced {
  display: none;
  margin-top: 16px;
  animation: slideDown 0.3s ease-out;
}
@keyframes slideDown {
  from { opacity: 0; transform: translateY(-20px); }
  to { opacity: 1; transform: translateY(0);}
}
input, select, textarea {
  width: 100%;
  padding: 10px 13px;
  margin-top: 8px;
  margin-bottom: 13px;
  border-radius: 4px;
  border: 1px solid #d2d6dc;
  font-size: 1rem;
}
input:focus, select:focus, textarea:focus {
  border-color: #238aff;
  outline: none;
}
.form-label {
  font-weight: 600;
  margin-bottom: 7px;
  display: block;
  color: #364c64;
}
/* Button style */
.save-btn {
  background-color: #007bff;
  color: white;
  border: none;
  padding: 15px 0;
  width: 100%;
  font-size: 1rem;
  border-radius: 8px;
  margin-top: 20px;
  cursor: pointer;
  font-weight: 600;
}
.save-btn:hover {
  background-color: #0056b3;
}
</style>

<script>
function toggleAdvanced() {
  const advancedDiv = document.getElementById('advanced-options');
  const chevron = document.getElementById('chevron-icon');
  if (advancedDiv.style.display === 'block') {
    advancedDiv.style.display = 'none';
    chevron.style.transform = 'rotate(0deg)';
  } else {
    advancedDiv.style.display = 'block';
    chevron.style.transform = 'rotate(180deg)';
  }
}
</script>

<div class="create-rule-container">
  <h2>Create Rule</h2>

    {% csrf_token %}
      
   
    {{ form.as_p }}
